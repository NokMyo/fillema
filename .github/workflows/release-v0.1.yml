name: Build and release Fillema v0.1

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fillema-v0.1-release
  cancel-in-progress: true

jobs:
  build-test-release:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64 -DFILLEMA_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test core
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Prepare lightweight package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path package-lite | Out-Null
          New-Item -ItemType Directory -Force -Path package-lite/tools | Out-Null
          Copy-Item build/Release/Fillema.exe package-lite/Fillema.exe
          Copy-Item README.md, LICENSE, THIRD_PARTY_NOTICES.md, CHANGELOG.md package-lite/
          @'
          This lightweight package expects ffmpeg.exe and ffprobe.exe either in this tools folder or on PATH.
          Download a Windows build with libx264/libx265 from https://github.com/BtbN/FFmpeg-Builds if needed.
          '@ | Set-Content -Encoding UTF8 package-lite/tools/README.txt
          Compress-Archive -Path package-lite/* -DestinationPath Fillema-v0.1-Windows-x64-lite.zip -CompressionLevel Optimal

      - name: Add FFmpeg to full package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl-shared.zip'
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-package
          $ffRoot = Get-ChildItem ffmpeg-package -Directory | Select-Object -First 1
          if (-not $ffRoot) { throw 'FFmpeg archive layout was not recognized.' }
          Copy-Item package-lite package-full -Recurse
          Copy-Item "$($ffRoot.FullName)/bin/*" package-full/tools/ -Force
          New-Item -ItemType Directory -Force -Path package-full/tools/licenses | Out-Null
          Get-ChildItem $ffRoot.FullName -File | Where-Object { $_.Name -match 'LICENSE|COPYING' } | Copy-Item -Destination package-full/tools/licenses/ -Force
          Remove-Item package-full/tools/README.txt -ErrorAction SilentlyContinue
          Compress-Archive -Path package-full/* -DestinationPath Fillema-v0.1-Windows-x64.zip -CompressionLevel Optimal

      - name: Write checksums
        shell: pwsh
        run: |
          $files = 'Fillema-v0.1-Windows-x64.zip', 'Fillema-v0.1-Windows-x64-lite.zip'
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $file"
          }
          $lines | Set-Content -Encoding ascii SHA256SUMS.txt

      - name: Point v0.1 tag at verified build
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --force v0.1 $env:GITHUB_SHA
          git push origin refs/tags/v0.1 --force

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1
          target_commitish: ${{ github.sha }}
          name: Febius Fillema v0.1
          body_path: RELEASE_NOTES.md
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: |
            Fillema-v0.1-Windows-x64.zip
            Fillema-v0.1-Windows-x64-lite.zip
            SHA256SUMS.txt
